<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Germ Zapper</title>
<style>
:root{--bg:#06231f;--bg2:#0b3b33;--card:#0d2f29;--hole:#04130f;--line:#1f6b5c;--ink:#f1fff9;--mute:#8fc9b8;--acc:#ffd23f;--bad:#ff5d73;--good:#3ddc97;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#e9fbf4;--bg2:#cdf1e4;--card:#ffffff;--hole:#bfe6d8;--line:#52b79f;--ink:#06231f;--mute:#2f6b5c}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#e9fbf4;--bg2:#cdf1e4;--card:#ffffff;--hole:#bfe6d8;--line:#52b79f;--ink:#06231f;--mute:#2f6b5c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Trebuchet MS",Verdana,sans-serif;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 60%);color:var(--ink);min-height:100vh;padding:20px 14px 40px;user-select:none}
main{max-width:460px;margin:0 auto}
h1{font-size:2.1rem;margin:0;text-align:center;letter-spacing:-.5px}
h1 b{color:var(--acc)}
.sub{text-align:center;color:var(--mute);margin:4px 0 16px}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tabs button{flex:1;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:700 1rem inherit;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#06231f}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px}
.hud{display:flex;justify-content:space-between;font-weight:700;margin-bottom:12px;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--hole),var(--bg));border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:3.2rem;cursor:pointer;overflow:hidden}
.hole span{transform:translateY(120%);transition:transform .12s}
.hole.up span{transform:none}
.hole.hit{border-color:var(--good)}.hole.oops{border-color:var(--bad)}
.go{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:var(--acc);color:#06231f;font:800 1.05rem inherit;font-family:inherit;cursor:pointer}
.go:focus-visible,.tabs button:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
p.how{color:var(--mute);line-height:1.5;margin:14px 2px 0}
.hidden{display:none}
.q{font-size:1.2rem;font-weight:700;margin:6px 0 14px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);font:600 1rem inherit;font-family:inherit;cursor:pointer}
.opt.right{background:var(--good);border-color:var(--good);color:#06231f}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.msg{min-height:1.4em;color:var(--mute);margin:4px 0}
@media (prefers-reduced-motion:reduce){.hole span{transition:none}}
</style>
</head>
<body>
<main>
<h1>🦠 Germ <b>Zapper</b></h1>
<p class="sub">Zap the germs, test your brain</p>
<div class="tabs">
<button id="tg" class="on">⚡ Play the Game</button>
<button id="tq">🧠 Take the Quiz</button>
</div>

<section id="game" class="panel">
<div class="hud"><span>⭐ <span id="sc">0</span></span><span>🦠 Zapped: <span id="zp">0</span></span><span>⏱️ <span id="tm">30</span>s</span><span>🏆 <span id="bs">0</span></span></div>
<div class="grid" id="grid"></div>
<button class="go" id="start">▶ Start / Restart</button>
<p class="how" id="how">Tap the germs 🦠 (+10) before they hide. Don’t tap the soap 🧼 (−15). Press Start to begin.</p>
</section>

<section id="quiz" class="panel hidden">
<div class="hud"><span>Question <span id="qn">1</span>/5</span><span>⭐ <span id="qs">0</span></span></div>
<div class="q" id="qt"></div>
<div id="qo"></div>
<div class="msg" id="qm"></div>
<button class="go hidden" id="qnext">Next question</button>
</section>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var grid=$('grid'),holes=[],score=0,zapped=0,time=30,run=false,tick,spawn,best=0;
try{best=+localStorage.getItem('gz-best')||0}catch(e){}
$('bs').textContent=best;
for(var i=0;i<9;i++){(function(i){var h=document.createElement('div');h.className='hole';h.innerHTML='<span></span>';h.addEventListener('pointerdown',function(){tap(i)});grid.appendChild(h);holes.push({el:h,kind:null,t:0})})(i)}
function show(i){var h=holes[i];if(h.kind)return;var bad=Math.random()<.2;h.kind=bad?'bad':'germ';h.el.firstChild.textContent=bad?'🧼':'🦠';h.el.classList.add('up');
h.t=setTimeout(function(){hide(i)},Math.max(450,900-zapped*12))}
function hide(i){var h=holes[i];clearTimeout(h.t);h.kind=null;h.el.classList.remove('up')}
function flash(i,c){var e=holes[i].el;e.classList.add(c);setTimeout(function(){e.classList.remove(c)},200)}
function tap(i){if(!run)return;var h=holes[i];if(!h.kind)return;
if(h.kind==='germ'){score+=10;zapped++;flash(i,'hit')}else{score=Math.max(0,score-15);flash(i,'oops')}
hide(i);$('sc').textContent=score;$('zp').textContent=zapped;if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}}
function loop(){if(!run)return;show(Math.floor(Math.random()*9));spawn=setTimeout(loop,Math.max(300,750-zapped*10))}
function end(){run=false;clearInterval(tick);clearTimeout(spawn);holes.forEach(function(_,i){hide(i)});
if(score>best){best=score;$('bs').textContent=best;try{localStorage.setItem('gz-best',best)}catch(e){}}
$('how').textContent='Time’s up! You zapped '+zapped+' germs for '+score+' points. Press Start to play again.'}
$('start').onclick=function(){clearInterval(tick);clearTimeout(spawn);holes.forEach(function(_,i){hide(i)});
score=0;zapped=0;time=30;run=true;$('sc').textContent=0;$('zp').textContent=0;$('tm').textContent=30;$('how').textContent='Go go go!';
tick=setInterval(function(){time--;$('tm').textContent=time;if(time<=0)end()},1000);loop()};

var Q=[
['What does “CPU” stand for?',['Central Processing Unit','Computer Personal Unit','Core Power Utility','Central Program Usage'],0],
['What is a “bug” in software?',['A feature request','An error in the code','A type of virus scanner','A slow internet link'],1],
['Which symbol starts a comment in Python?',['//','#','--','/*'],1],
['What does HTML describe?',['Database rules','The structure of a web page','Network speed','Image compression'],1],
['Which is a web browser?',['Firefox','Photoshop','Excel','Zoom'],0]
];
var qi=0,qsc=0,locked=false;
function ask(){locked=false;var q=Q[qi];$('qn').textContent=qi+1;$('qs').textContent=qsc;$('qt').textContent=q[0];$('qm').textContent='';$('qnext').classList.add('hidden');
var box=$('qo');box.innerHTML='';q[1].forEach(function(t,i){var b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=function(){pick(i,b)};box.appendChild(b)})}
function pick(i,b){if(locked)return;locked=true;var q=Q[qi],bs=$('qo').children;
if(i===q[2]){b.classList.add('right');qsc+=20;$('qm').textContent='Correct! +20'}else{b.classList.add('wrong');bs[q[2]].classList.add('right');$('qm').textContent='Not quite.'}
$('qs').textContent=qsc;var n=$('qnext');n.textContent=qi<Q.length-1?'Next question':'See my score';n.classList.remove('hidden')}
function nextH(){if(qi<Q.length-1){qi++;ask();return}
$('qt').textContent='Quiz done! You scored '+qsc+' of 100.';$('qo').innerHTML='';$('qm').textContent=qsc>=80?'Brilliant brain! 🧠':'Try again to beat it.';
var n=$('qnext');n.textContent='Play again';n.onclick=function(){n.onclick=nextH;qi=0;qsc=0;ask()}}
$('qnext').onclick=nextH;
function tab(q){run=false;clearInterval(tick);clearTimeout(spawn);holes.forEach(function(_,i){hide(i)});
$('game').classList.toggle('hidden',q);$('quiz').classList.toggle('hidden',!q);$('tg').classList.toggle('on',!q);$('tq').classList.toggle('on',q);
if(q){qi=0;qsc=0;$('qnext').onclick=nextH;ask()}}
$('tg').onclick=function(){tab(false)};$('tq').onclick=function(){tab(true)};
})();
</script>
</body>
</html>
